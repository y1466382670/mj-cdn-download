services:
  mj-cdn-download:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      STORAGE: local
      # CDN only. Files stay local. Point the hostname at /files/.
      # CDN_BASE_URL: https://img.example.com/files
      # R2: set STORAGE to s3. CDN_BASE_URL is the bucket's public hostname, without /files.
      # STORAGE: s3
      # S3_ENDPOINT: https://<account_id>.r2.cloudflarestorage.com
      # S3_REGION: auto
      # S3_BUCKET: your-bucket
      # S3_ACCESS_KEY: your-access-key
      # S3_SECRET_KEY: your-secret-key
      # S3_PATH_STYLE: "true"
      # CDN_BASE_URL: https://img.example.com
    volumes:
      - ./data:/data
    shm_size: "1gb"
    restart: unless-stopped
